# Publishes the web app (app/static) to GitHub Pages on every push to main,
# after the Python and browser tests pass.
name: Test and publish web app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: pip install -e '.[dev]'
      - run: pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Browsers cache each file for 10 minutes: stamp references with this
      # commit so nobody gets a mix of old and new files after a deploy.
      - run: python3 tools/version_assets.py app/static "${GITHUB_SHA::8}"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/static
      - id: deployment
        uses: actions/deploy-pages@v4
